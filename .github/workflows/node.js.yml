# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
build: # job name
runs-on: ubuntu-latest # runner or machine
strategy:
Matrix: # Run once per Node version
node-version: [24.x] # Node versions to test
steps: # tasks to run in order
- uses: actions/checkout@v4 # get the code
- name: Use Node.js ${{ matrix.node-version }} # step name
uses: actions/setup-node@v4 # install Node
with:
node-version: ${{ matrix.node-version }}
cache: 'npm' # reuse packages
- run: npm ci # install packages (ci = clean install)
- run: npm run lint # check code style
- run: npm test # run tests
